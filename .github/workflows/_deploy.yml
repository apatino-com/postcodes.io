# Reusable workflow for building and deploying the Node.js app to Azure Web Apps
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      publish-profile:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postcodesio
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postcodeio_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        env:
          NODE_ENV: test
          POSTGRES_USER: postcodesio
          POSTGRES_PASSWORD: password
          POSTGRES_DATABASE: postcodeio_testing
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v5
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ inputs.app-name }}
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.publish-profile }}
